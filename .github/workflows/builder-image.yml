name: Build image

# Publishes the build environment (Rust + MinGW-w64 + NSIS) to GitHub Container
# Registry: ghcr.io/<owner>/notch-builder. Uses the built-in GITHUB_TOKEN.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    paths: ["docker/**", ".github/workflows/builder-image.yml"]

permissions:
  contents: read
  packages: write

jobs:
  builder-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/notch-builder
          tags: |
            type=raw,value=latest
            type=raw,value=1.0.0
      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max